name: .NET Upskilling CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup .NET environment
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0'
        
    - name: Restore dependencies
      run: dotnet restore
      continue-on-error: true
      
    - name: Build project
      run: dotnet build --no-restore --configuration Release
      continue-on-error: true
      
    - name: Run tests
      run: dotnet test --no-build --verbosity normal
      continue-on-error: true
      
    - name: Intentional failure check
      run: |
        echo "Pipeline test with intentional failure"
        echo "This step demonstrates how pipeline failures are handled"
        exit 1
      continue-on-error: false
      
    - name: Code quality analysis
      run: |
        echo "Running code quality checks..."
        echo "Linting dotnet files"
      continue-on-error: true

  documentation:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Build documentation
      run: |
        echo "Building documentation from dotnet folder"
        ls -la dotnet/
        
    - name: Upload documentation
      run: echo "Documentation uploaded successfully"

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-test, documentation]
    if: always()
    
    steps:
    - name: Notify on completion
      run: |
        echo "Pipeline execution completed"
        echo "Status: Check logs above for details"
